name: provenance

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: provenance-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenance}
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
    ports:
      # host port defaults to 5433 to avoid clashing with other local
      # Postgres instances; in-container it's always 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: provenance-api
    # Load the repo-root .env (for ANTHROPIC_API_KEY) when present. Optional, so
    # on a host that injects secrets as env vars this is simply skipped. The
    # environment block below overrides the DB host/port for the compose network.
    env_file:
      - path: ../.env
        required: false
    environment:
      # inside the compose network the API reaches Postgres at db:5432
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-provenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provenance}
      POSTGRES_DB: ${POSTGRES_DB:-provenance}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # serve the eval dashboard's results.json (gitignored, not baked into the
      # image) read-only; the endpoint 404s gracefully if it isn't there yet
      - ../data/eval:/app/data/eval:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
