# Fly.io config for the Provenance API + UI. See infra/DEPLOY.md.
# `fly launch --no-deploy` from the repo root, then `fly deploy`.
app = "provenance"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  # DB connection comes from the PROVENANCE_DB_URL secret (set via `fly secrets`);
  # ANTHROPIC_API_KEY is also a secret. Nothing sensitive lives in this file.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/healthz"
      interval = "30s"
      timeout = "5s"

[[vm]]
  # bge query-encoder + ONNX re-ranker fit comfortably; bump if needed.
  memory = "1gb"
  cpus = 1
